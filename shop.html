<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GateFlow - Premium Shop</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    
    <nav class="navbar glass animated-element">
        <div class="logo">
            <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <i class="fa-solid fa-stadium"></i> GateFlow
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Live Traffic</a></li>
            <li><a href="tickets.html">Tickets</a></li>
            <li><a href="fanzone.html">Fan Zone</a></li>
            <li><a href="shop.html" class="active">Shop</a></li>
        </ul>
        <div class="nav-controls">
            <button id="theme-toggle-btn" class="theme-toggle"><i class="fa-solid fa-circle-half-stroke"></i></button>
            <button onclick="window.location.href='index.html'" class="glass-btn" style="width:auto; padding:0.5rem 1rem;">Log In</button>
        </div>
    </nav>

    <main class="container">
        <div style="text-align:center; margin-bottom: 2rem;" class="animated-element delay-1">
            <h1 style="font-weight:800; font-size:3rem; background: linear-gradient(90deg, var(--color-primary), var(--color-warning)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px;">
                STADIUM SHOP
            </h1>
            <p style="color:var(--text-secondary); margin-top:0.5rem; font-size:1.1rem;">Pre-order stadium food & official team merchandise.</p>
        </div>

        <!-- Filters -->
        <div class="glass hover-float animated-element delay-2" style="padding:1.5rem; border-radius:12px; margin-bottom:2rem; display:flex; gap:1rem; flex-wrap:wrap; justify-content:space-between; align-items:center;">
            <div style="display:flex; gap:1.5rem; align-items:center;">
                <div>
                    <label style="color:var(--text-secondary); font-size:0.8rem; display:block; margin-bottom:0.3rem;">Team Merchandise</label>
                    <select id="match-select" class="glass-input" style="width: 200px; padding:0.6rem; font-weight:600;">
                        <option value="CSKvsMI">CSK vs MI</option>
                        <option value="RCBvsKKR">RCB vs KKR</option>
                    </select>
                </div>
                <div>
                    <label style="color:var(--text-secondary); font-size:0.8rem; display:block; margin-bottom:0.3rem;">Stadium Food Menu</label>
                    <select id="food-stadium-select" class="glass-input" style="width: 200px; padding:0.6rem; font-weight:600;">
                        <option value="Eden Gardens">Eden Gardens</option>
                        <option value="Wankhede">Wankhede Stadium</option>
                        <option value="Narendra Modi Stadium">Narendra Modi Stadium</option>
                    </select>
                </div>
            </div>
            <div style="background:rgba(16, 185, 129, 0.1); border:1px solid var(--color-primary); padding:0.6rem 1.2rem; border-radius:30px; display:flex; align-items:center; gap:0.5rem; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);">
                <i class="fa-solid fa-cart-shopping" style="color:var(--color-primary);"></i>
                <span style="color:var(--text-primary); font-weight:bold;">Cart Total: <span id="cart-total" style="color:var(--color-primary); font-size:1.2rem; margin-left:5px;">₹0</span></span>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Left Col: Merchandise -->
            <div class="animated-element delay-3" style="grid-column: span 1;">
                <section class="section glass hover-float" style="height: 100%;">
                    <header class="section-header" style="border-bottom:1px solid var(--glass-border); padding-bottom:1rem; margin-bottom:1.5rem;">
                        <h2><i class="fa-solid fa-shirt" style="color:var(--color-warning); margin-right:0.5rem;"></i> Official Merchandise</h2>
                    </header>
                    <div id="merch-container" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:1.5rem;">
                        <!-- Injected by JS -->
                    </div>
                </section>
            </div>

            <!-- Right Col: Food Menu -->
            <div class="animated-element delay-3" style="grid-column: span 1;">
                <section class="section glass hover-float" style="height: 100%;">
                    <header class="section-header" style="border-bottom:1px solid var(--glass-border); padding-bottom:1rem; margin-bottom:1.5rem;">
                        <h2><i class="fa-solid fa-burger" style="color:var(--color-danger); margin-right:0.5rem;"></i> Express Food Pickup</h2>
                    </header>
                    <div id="food-container" style="display:flex; flex-direction:column; gap:1rem;">
                        <!-- Injected by JS -->
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        const shopData = {
            merch: {
                "CSKvsMI": [
                    { name: "CSK Match Jersey '26", price: 1999, img: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", tag: "CSK", tagColor: "#F59E0B" },
                    { name: "MI Training Cap", price: 799, img: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", tag: "MI", tagColor: "#3B82F6" },
                    { name: "CSK Fan Flag", price: 299, img: "https://images.unsplash.com/photo-1566888596782-c7f41bc1b6d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", tag: "CSK", tagColor: "#F59E0B" },
                    { name: "Mumbai Indians Mini Bat", price: 1499, img: "https://images.unsplash.com/photo-1593341646782-e0b495cff86d?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", tag: "MI", tagColor: "#3B82F6" }
                ],
                "RCBvsKKR": [
                    { name: "RCB 2026 Home Jersey", price: 2199, img: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", tag: "RCB", tagColor: "#EF4444" },
                    { name: "KKR Premium Cap", price: 899, img: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", tag: "KKR", tagColor: "#8B5CF6" },
                    { name: "RCB Signature Bat", price: 2499, img: "https://images.unsplash.com/photo-1593341646782-e0b495cff86d?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", tag: "RCB", tagColor: "#EF4444" }
                ]
            },
            food: {
                "Eden Gardens": [
                    { name: "Kolkata Kathi Roll", desc: "Spicy chicken wrapped in paratha.", price: 150, icon: "fa-hotdog", prep: "5 mins" },
                    { name: "Rosogolla Bucket (4 pcs)", desc: "Classic Bengali sweet.", price: 100, icon: "fa-bowl-food", prep: "2 mins" },
                    { name: "Cutting Chai & Samosa", desc: "Hot tea with 2 crispy samosas.", price: 80, icon: "fa-mug-hot", prep: "3 mins" },
                    { name: "Phuchka Platter", desc: "Spicy & tangy street food favorite.", price: 60, icon: "fa-bowl-rice", prep: "1 min" }
                ],
                "Wankhede": [
                    { name: "Vada Pav Combo", desc: "2 Vada Pavs + Green Chutney.", price: 120, icon: "fa-burger", prep: "3 mins" },
                    { name: "Mumbai Pav Bhaji", desc: "Buttery pav with spicy bhaji.", price: 180, icon: "fa-bowl-rice", prep: "7 mins" },
                    { name: "Cold Coffee", desc: "Chilled and refreshing.", price: 110, icon: "fa-glass-water", prep: "2 mins" }
                ],
                "Narendra Modi Stadium": [
                    { name: "Gujarati Fafda Jalebi", desc: "Sweet and savory classic combo.", price: 140, icon: "fa-bowl-food", prep: "4 mins" },
                    { name: "Khaman Dhokla", desc: "Soft, spongy, and perfectly spiced.", price: 90, icon: "fa-burger", prep: "2 mins" },
                    { name: "Masala Chaas", desc: "Cooling spiced buttermilk.", price: 50, icon: "fa-glass-water", prep: "1 min" }
                ]
            }
        };

        let cartTotal = 0;

        function updateCart(price, btnElement) {
            cartTotal += price;
            
            // Animate Cart Value
            const cartSpan = document.getElementById('cart-total');
            cartSpan.innerText = `₹${cartTotal}`;
            cartSpan.style.animation = 'none';
            setTimeout(() => cartSpan.style.animation = 'pulseGlow 0.5s ease', 10);
            
            // Animate Button
            const originalText = btnElement.innerText;
            btnElement.innerText = "ADDED!";
            btnElement.style.background = "var(--color-primary)";
            btnElement.style.color = "white";
            
            setTimeout(() => {
                btnElement.innerText = originalText;
                btnElement.style.background = "";
                btnElement.style.color = "";
            }, 1000);
            
            // Haptic
            if(navigator.vibrate) navigator.vibrate(50);
        }

        function renderMerch() {
            const match = document.getElementById('match-select').value;
            const container = document.getElementById('merch-container');
            const items = shopData.merch[match] || [];
            
            container.innerHTML = items.map(item => `
                <div style="background:var(--bg-secondary); border-radius:12px; overflow:hidden; border:1px solid var(--glass-border); transition:transform 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1);" class="hover-float">
                    <div style="height:160px; width:100%; position:relative;">
                        <img src="${item.img}" alt="${item.name}" style="width:100%; height:100%; object-fit:cover; opacity:0.9;">
                        <span style="position:absolute; top:10px; right:10px; background:${item.tagColor}; color:#fff; font-size:0.7rem; font-weight:bold; padding:4px 10px; border-radius:12px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); text-shadow: 0 1px 2px rgba(0,0,0,0.5);">${item.tag}</span>
                    </div>
                    <div style="padding:1rem;">
                        <h4 style="color:var(--text-primary); font-size:1rem; margin-bottom:0.5rem; line-height:1.3; font-weight:700;">${item.name}</h4>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1rem;">
                            <span style="color:var(--text-primary); font-weight:800; font-size:1.1rem;">₹${item.price}</span>
                            <button class="glass-btn" style="padding:0.4rem 0.8rem; width:auto; border-radius:20px; font-size:0.8rem; border-color:var(--color-primary); color:var(--text-primary);" onclick="updateCart(${item.price}, this)">ADD <i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderFood() {
            const stadium = document.getElementById('food-stadium-select').value;
            const container = document.getElementById('food-container');
            const items = shopData.food[stadium] || [];
            
            container.innerHTML = items.map(item => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.02); padding:1rem; border-radius:12px; border:1px solid var(--glass-border); transition:border-color 0.3s;" class="hover-float">
                    <div style="display:flex; gap:1.2rem; align-items:center;">
                        <div style="width:60px; height:60px; border-radius:12px; background:linear-gradient(135deg, rgba(239, 68, 68, 0.2), transparent); border: 1px solid rgba(239, 68, 68, 0.3); display:flex; justify-content:center; align-items:center;">
                            <i class="fa-solid ${item.icon}" style="font-size:1.8rem; color:var(--color-danger); text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);"></i>
                        </div>
                        <div>
                            <h4 style="color:var(--text-primary); margin-bottom:0.3rem; font-size:1.1rem; font-weight:700;">${item.name}</h4>
                            <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:0.4rem;">${item.desc}</p>
                            <span style="font-size:0.75rem; background:rgba(245, 158, 11, 0.1); color:var(--color-warning); padding:2px 8px; border-radius:10px; border: 1px solid rgba(245, 158, 11, 0.2);"><i class="fa-solid fa-clock"></i> Prep: ${item.prep}</span>
                        </div>
                    </div>
                    <div style="text-align:right; min-width: 90px;">
                        <div style="color:var(--text-primary); font-weight:800; font-size:1.2rem; margin-bottom:0.5rem;">₹${item.price}</div>
                        <button class="glass-btn" style="padding:0.4rem 0.8rem; width:100%; border-radius:20px; font-size:0.8rem; border-color:var(--color-primary); color:var(--color-primary); font-weight:bold;" onclick="updateCart(${item.price}, this)">Add</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('match-select').addEventListener('change', renderMerch);
        document.getElementById('food-stadium-select').addEventListener('change', renderFood);

        document.addEventListener('DOMContentLoaded', () => {
            renderMerch();
            renderFood();
        });
    </script>
</body>
</html>
