<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GateFlow - Professional Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    
    <!-- Home Button at top left -->
    <div style="position:absolute; top:20px; left:20px;">
        <button onclick="window.location.href='dashboard.html'" class="theme-toggle" style="width:auto; padding:0 1rem; gap:0.5rem;"><i class="fa-solid fa-house"></i> Home</button>
    </div>

    <!-- Theme Toggle at top right -->
    <div style="position:absolute; top:20px; right:20px;">
        <button id="theme-toggle-btn" class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
    </div>

    <div class="login-container glass animated-element">
        <div class="login-header">
            <i class="fa-solid fa-stadium logo-icon"></i>
            <h1 id="form-title">GateFlow</h1>
            <p id="form-subtitle">Smart Stadium Advisory</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="glass-input" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="glass-input" placeholder="Enter password" required>
            </div>
            <p id="error-msg" style="color:var(--color-danger); font-size:0.85rem; display:none; margin-bottom:1rem;">Invalid credentials. Try again.</p>
            <button type="submit" class="glass-btn" id="submit-btn" style="margin-bottom:1rem;">Secure Login</button>
        </form>
        
        <div style="text-align:center; margin-bottom: 1.5rem; border-bottom:1px solid var(--glass-border); padding-bottom:1.5rem;">
            <p style="color:var(--text-secondary); font-size:0.9rem;">
                <span id="toggle-prefix">Don't have an account?</span> 
                <a href="#" id="toggle-mode" style="color:var(--color-primary); font-weight:bold; text-decoration:none;">Sign Up</a>
            </p>
        </div>

        <div style="text-align:center; margin-bottom: 1rem;">
            <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:0.5rem;">New Fan? Check out the Live Traffic</p>
            <button class="glass-btn glass-btn-outline" onclick="window.location.href='dashboard.html'">View Public Dashboard</button>
        </div>

        <div class="login-hints" id="demo-hints">
            <p>Demo Admin: <b>admin / password</b></p>
            <p style="margin-top:0.5rem;">Demo User: <b>sahil / password</b></p>
        </div>
    </div>
    
    <script src="auth.js"></script>
    <script>
        const currentUser = getCurrentUser();
        if(currentUser) {
            window.location.href = currentUser.role === 'admin' ? 'admin.html' : 'user.html';
        }

        let isLoginMode = true;

        // Clean event listener that updates text instead of replacing DOM elements
        document.getElementById('toggle-mode').addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const btn = document.getElementById('submit-btn');
            const prefix = document.getElementById('toggle-prefix');
            const toggleModeBtn = document.getElementById('toggle-mode');
            const errorMsg = document.getElementById('error-msg');
            const hints = document.getElementById('demo-hints');
            
            // Reset error messages on toggle
            errorMsg.style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';

            if(isLoginMode) {
                title.innerText = 'GateFlow';
                subtitle.innerText = 'Smart Stadium Advisory';
                btn.innerText = 'Secure Login';
                hints.style.display = 'block';
                prefix.innerText = "Don't have an account?";
                toggleModeBtn.innerText = "Sign Up";
            } else {
                title.innerText = 'Create Account';
                subtitle.innerText = 'Join the Fan Community';
                btn.innerText = 'Register Now';
                hints.style.display = 'none'; // hide hints in register mode
                prefix.innerText = "Already have an account?";
                toggleModeBtn.innerText = "Log In";
            }
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            if(isLoginMode) {
                const user = login(u, p);
                if(user) {
                    window.location.href = user.role === 'admin' ? 'admin.html' : 'user.html';
                } else {
                    errorMsg.innerText = 'Invalid credentials. Try again.';
                    errorMsg.style.display = 'block';
                }
            } else {
                // Registration validation
                if(u.length < 3) {
                    errorMsg.innerText = 'Username must be at least 3 characters.';
                    errorMsg.style.display = 'block';
                    return;
                }
                if(p.length < 4) {
                    errorMsg.innerText = 'Password must be at least 4 characters.';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                // Process registration
                const result = register(u, p);
                if(result.error) {
                    errorMsg.innerText = result.error;
                    errorMsg.style.display = 'block';
                } else {
                    alert("Account Created Successfully! Welcome to GateFlow.");
                    window.location.href = 'user.html';
                }
            }
        });
    </script>
</body>
</html>
